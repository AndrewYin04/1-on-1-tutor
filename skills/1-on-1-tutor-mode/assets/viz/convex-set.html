<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convex or not: the segment test</title>
<!--
  Tutor-mode figure: a region in the plane with two draggable points. The segment
  between them turns green when it stays inside the set and red when it leaves,
  which is exactly the definition of convexity. Toggle between a convex pentagon
  and a non-convex L-shape. Library: JSXGraph (pinned). Edit SHAPES to change sets.
-->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.13.2/distrib/jsxgraph.css">
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.13.2/distrib/jsxgraphcore.js"></script>
<style>
  :root { color-scheme: light dark; --fg:#1f1f1e; --muted:#6b6a66; --bg:#fbfaf7; --panel:#ffffff; --border:#d9d7cf; --accent:#534AB7; --ok:#1D9E75; --bad:#E24B4A; }
  @media (prefers-color-scheme: dark) { :root { --fg:#ece9e0; --muted:#a3a19a; --bg:#1a1a19; --panel:#242423; --border:#3b3a37; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:20px; font-weight:500; margin:0 0 4px; }
  .caption { color:var(--muted); margin:0 0 16px; }
  .figure { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
  #board { width:100%; aspect-ratio:7/5; background:transparent; }
  .controls { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; margin-top:12px; }
  .controls label { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); }
  .status { font-size:14px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  footer { color:var(--muted); font-size:13px; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>Convex or not: the segment test</h1>
  <p class="caption">Drag A and B. The set is convex exactly when every such segment stays inside.</p>
  <div class="figure">
    <div id="board"></div>
    <div class="controls">
      <label>Set
        <select id="shape">
          <option value="pentagon">convex pentagon</option>
          <option value="lshape">non-convex L-shape</option>
        </select>
      </label>
      <span class="status" id="status"></span>
    </div>
  </div>
  <footer>Tutor Mode figure</footer>
</main>
<script>
  const SHAPES = {
    pentagon: [[-3,-3],[3,-3],[4,1],[0,4],[-4,1]],
    lshape:   [[-4,-3],[1,-3],[1,-1],[-2,-1],[-2,3],[-4,3]]
  };
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const fg = dark ? '#ece9e0' : '#1f1f1e';
  const board = JXG.JSXGraph.initBoard('board', {
    boundingbox: [-6, 5, 6, -5], axis: true, keepaspectratio: true,
    showCopyright: false, showNavigation: false,
    defaultAxes: { x: { strokeColor: fg, ticks: { strokeColor: fg, label: { strokeColor: fg } } },
                   y: { strokeColor: fg, ticks: { strokeColor: fg, label: { strokeColor: fg } } } }
  });
  let poly = null;
  const A = board.create('point', [-2, 0], { name: 'A', size: 5, strokeColor: '#534AB7', fillColor: '#534AB7', label: { strokeColor: fg } });
  const B = board.create('point', [2, 1.5], { name: 'B', size: 5, strokeColor: '#534AB7', fillColor: '#534AB7', label: { strokeColor: fg } });
  const seg = board.create('segment', [A, B], { strokeWidth: 4, strokeColor: '#1D9E75' });

  function inside(pt, verts) {
    let c = false;
    for (let i = 0, j = verts.length - 1; i < verts.length; j = i++) {
      const [xi, yi] = verts[i], [xj, yj] = verts[j];
      const cross = (yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi;
      if (cross) c = !c;
    }
    return c;
  }
  function refresh() {
    const verts = SHAPES[document.getElementById('shape').value];
    const a = [A.X(), A.Y()], b = [B.X(), B.Y()];
    const status = document.getElementById('status');
    if (!inside(a, verts) || !inside(b, verts)) {
      seg.setAttribute({ strokeColor: '#888780' });
      status.className = 'status';
      status.textContent = 'move both points inside the set';
      return;
    }
    let stays = true;
    for (let k = 0; k <= 80; k++) {
      const t = k / 80;
      if (!inside([a[0] + t * (b[0] - a[0]), a[1] + t * (b[1] - a[1])], verts)) { stays = false; break; }
    }
    seg.setAttribute({ strokeColor: stays ? '#1D9E75' : '#E24B4A' });
    status.className = 'status ' + (stays ? 'ok' : 'bad');
    status.textContent = stays ? 'segment stays inside' : 'segment leaves the set: not convex';
  }
  function draw() {
    if (poly) board.removeObject(poly);
    const verts = SHAPES[document.getElementById('shape').value];
    poly = board.create('polygon', verts, {
      fillColor: '#534AB7', fillOpacity: 0.18, highlightFillOpacity: 0.18,
      borders: { strokeColor: '#534AB7', strokeWidth: 2 }, vertices: { visible: false }, hasInnerPoints: false, fixed: true
    });
    refresh();
  }
  A.on('drag', refresh); B.on('drag', refresh);
  document.getElementById('shape').addEventListener('change', draw);
  draw();
</script>
</body>
</html>
