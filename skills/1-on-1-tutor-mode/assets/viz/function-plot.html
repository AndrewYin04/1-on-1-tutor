<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One function, one parameter</title>
<!--
  Tutor-mode figure: a function of x with one slider per parameter. Keep it to the
  parameters the chunk is about (one is best). Library: function-plot (pinned),
  which bundles its own d3. Edit FN, PARAMS, and the domains below.
-->
<script src="https://cdn.jsdelivr.net/npm/function-plot@1.25.4/dist/function-plot.js"></script>
<style>
  :root { color-scheme: light dark; --fg:#1f1f1e; --muted:#6b6a66; --bg:#fbfaf7; --panel:#ffffff; --border:#d9d7cf; --accent:#534AB7; }
  @media (prefers-color-scheme: dark) { :root { --fg:#ece9e0; --muted:#a3a19a; --bg:#1a1a19; --panel:#242423; --border:#3b3a37; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:20px; font-weight:500; margin:0 0 4px; }
  .caption { color:var(--muted); margin:0 0 16px; }
  .figure { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; overflow:auto; }
  #plot { color: var(--fg); }
  #plot .x.axis text, #plot .y.axis text { fill: var(--fg); }
  #plot .x.axis path, #plot .y.axis path, #plot .x.axis line, #plot .y.axis line { stroke: var(--muted); }
  #plot .origin { stroke: var(--muted); }
  .controls { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; margin-top:12px; }
  .controls label { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); }
  .readout { font-variant-numeric:tabular-nums; min-width:3ch; color:var(--fg); }
  footer { color:var(--muted); font-size:13px; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>f(x) = a·x² + b·x + c</h1>
  <p class="caption">Move a through zero and watch the bowl flip: a > 0 is convex, a < 0 is not.</p>
  <div class="figure">
    <div id="plot"></div>
    <div class="controls" id="controls"></div>
  </div>
  <footer>Tutor Mode figure</footer>
</main>
<script>
  const FN = 'a * x^2 + b * x + c';
  const PARAMS = { a: { min: -3, max: 3, step: 0.1, value: 1 }, b: { min: -4, max: 4, step: 0.1, value: 0 }, c: { min: -5, max: 5, step: 0.5, value: 0 } };
  const X_DOMAIN = [-5, 5], Y_DOMAIN = [-8, 12];
  const scope = {};
  const controls = document.getElementById('controls');
  for (const [name, p] of Object.entries(PARAMS)) {
    scope[name] = p.value;
    const label = document.createElement('label');
    label.innerHTML = name + ' <input type="range" min="' + p.min + '" max="' + p.max + '" step="' + p.step + '" value="' + p.value + '" data-name="' + name + '"> <span class="readout" id="out-' + name + '">' + p.value + '</span>';
    controls.appendChild(label);
  }
  function draw() {
    const width = Math.min(720, document.getElementById('plot').clientWidth || 720);
    functionPlot({
      target: '#plot', width: width, height: 380, grid: true, disableZoom: true,
      xAxis: { domain: X_DOMAIN }, yAxis: { domain: Y_DOMAIN },
      data: [{ fn: FN, scope: Object.assign({}, scope), color: '#534AB7', graphType: 'polyline' }]
    });
  }
  controls.addEventListener('input', function (e) {
    if (e.target.tagName !== 'INPUT') return;
    const name = e.target.dataset.name;
    scope[name] = Number(e.target.value);
    document.getElementById('out-' + name).textContent = Number(e.target.value).toFixed(1);
    draw();
  });
  draw();
</script>
</body>
</html>
